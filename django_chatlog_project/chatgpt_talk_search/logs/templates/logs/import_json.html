{% extends 'base.html' %}

{% block content %}

<h2>タイトル一覧</h2>

<div class="accordion" id="accordionExample">

{% for title, dates in data.items %}

    <div class="accordion-item">

    <!-- タイトル -->
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ forloop.counter }}" aria-expanded="false" aria-controls="collapse{{ forloop.counter }}">
            {{ title }}
        </button>
      </h2>

      <!-- 中身 -->
      <div id="collapse{{ forloop.counter }}" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
        <div class="accordion-body">

            <!-- 日付ごと -->
            {% for date, logs in dates.logs_by_date.items %}
                
                <h5>{{ date }}</h5>

                <div class="list-group">
            
                <!-- ログ一覧 -->
                    {% for log in logs %}
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                
                            <span> {{ log }}</span>

                            <button class="btn btn-sm btn-outline-secondary"
                            onclick="copyText(this)">
                            コピー
                            </button>
                        </div>
                    {% endfor %}

                </div>

            {% endfor %}
        </div>
      </div>
    </div>
{% endfor %}

<!-- コピーJS -->
<script>
    function copyText(button) {
        const text = button.previousElementSibling.innerText;
    
        navigator.clipboard.writeText(text)
            .then(() => {
                alert("コピーしました！");
            })
            .catch(() => {
                alert("コピー失敗");
            });
    }
</script>
{% endblock %}
