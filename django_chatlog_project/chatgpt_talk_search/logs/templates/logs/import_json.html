{% extends 'base.html' %}

{% block content %}

<h2>タイトル一覧</h2>

{% for title, data in titles %}
    <div>
        <a href="?title={{ title }}">{{ title }}</a>
    </div>
{% endfor %}

<hr>

{% if dates %}
    <h3>日付一覧</h3>
    {% for d in dates %}
        <div>
            <a href="?title={{ request.GET.title }}&date={{ d }}">{{ d }}</a>
        </div>
    {% endfor %}
{% endif %}

<hr>

{% if logs %}
    <h3>ログ内容</h3>
    {% for log in logs %}
        <div style="margin-bottom: 12px; border: 1px solid #ddd; padding: 10px;">
            <p>{{ log }}</p>
        </div>
    {% endfor %}
{% endif %}

{% endblock %}
