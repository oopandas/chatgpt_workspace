{% extends "base.html" %}

{% block title %}
    zipファイルをアップロードしてください
{% endblock  %}

{% block content %}
    <form class="" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <p>ここにzipファイルをアップロード</p>
        <input type="file" name="zip_file" accept=".zip" required>
        
        <button type="submit">送信</button>
    </form>

{% endblock %}
